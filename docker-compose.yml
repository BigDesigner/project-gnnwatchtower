version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: netmon-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-netmon_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-netmon_secure_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-netmon_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-netmon_admin} -d ${POSTGRES_DB:-netmon_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - netmon-internal

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: netmon-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    cap_add:
      - NET_RAW
      - NET_ADMIN
    environment:
      PORT: ${BACKEND_PORT:-8080}
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-netmon_admin}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-netmon_secure_password_2026}
      DB_NAME: ${POSTGRES_DB:-netmon_db}
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_netmon_system_change_me}
      DEFAULT_SUBNET: ${SCAN_SUBNET:-192.168.1.0/24}
      BACKUP_DIR: /app/backups
    volumes:
      - backup_data:/app/backups
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    networks:
      - netmon-internal
      - netmon-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: netmon-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    networks:
      - netmon-internal
      - netmon-network

volumes:
  postgres_data:
    name: netmon_postgres_data
  backup_data:
    name: netmon_backup_data

networks:
  netmon-internal:
    internal: true
  netmon-network:
    driver: bridge
