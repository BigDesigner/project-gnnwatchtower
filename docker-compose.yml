version: '3.8'

services:
  watchtower:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gnnwatchtower
    restart: unless-stopped
    cap_add:
      - NET_RAW
      - NET_ADMIN
    environment:
      SERVER_PORT: 3800
      GIN_MODE: release
      JWT_SECRET: ${JWT_SECRET:-gnnwatchtower_secure_jwt_token_2026}
      DEFAULT_SCAN_SUBNET: ${DEFAULT_SCAN_SUBNET:-192.168.1.0/24}
      DEFAULT_CHECK_INTERVAL: ${DEFAULT_CHECK_INTERVAL:-15}
    volumes:
      - watchtower_data:/opt/gnnwatchtower/data
      - watchtower_backups:/opt/gnnwatchtower/backups
    ports:
      - "3800:3800"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3800/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - watchtower-net

volumes:
  watchtower_data:
    name: gnnwatchtower_data
  watchtower_backups:
    name: gnnwatchtower_backups

networks:
  watchtower-net:
    driver: bridge
