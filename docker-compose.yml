version: '3.8'

services:
  watchtower:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gnnwatchtower
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    sysctls:
      net.ipv4.ping_group_range: "10001 10001"
    environment:
      SERVER_PORT: 3800
      GIN_MODE: release
      BIND_ADDRESS: 0.0.0.0
      TLS_ENABLED: "true"
      DEFAULT_CHECK_INTERVAL: ${DEFAULT_CHECK_INTERVAL:-15}
    volumes:
      - watchtower_data:/opt/gnnwatchtower/data
      - watchtower_backups:/opt/gnnwatchtower/backups
    ports:
      - "127.0.0.1:3800:3800"
    healthcheck:
      test: ["CMD-SHELL", "test -s /opt/gnnwatchtower/data/cert.pem && curl --cacert /opt/gnnwatchtower/data/cert.pem -f https://localhost:3800/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - watchtower-net

volumes:
  watchtower_data:
    name: gnnwatchtower_data
  watchtower_backups:
    name: gnnwatchtower_backups

networks:
  watchtower-net:
    driver: bridge
